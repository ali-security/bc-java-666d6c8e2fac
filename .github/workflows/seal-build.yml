name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.5'
      - name: Build bcprov jar
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        run: ./gradlew --no-daemon --console=plain -s :prov:jar
      - uses: actions/upload-artifact@v4
        with:
          name: bcprov-jar
          path: prov/build/libs/bcprov-jdk18on-*.jar
          if-no-files-found: error
